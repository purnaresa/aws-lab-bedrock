AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AWS SAM template for PII Scanner Lambda with security best practices

Parameters:
  BedrockModelId:
    Type: String
    Default: 'anthropic.claude-3-haiku-20240307-v1:0'
    Description: 'Bedrock model ID for PII detection'

Resources:
  ScanPIIFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: lambda_function.lambda_handler
      Runtime: python3.11
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          BEDROCK_MODEL_ID: !Ref BedrockModelId
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - 'bedrock:InvokeModel'
              Resource: 
                - !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/anthropic.claude*'
            - Effect: Allow
              Action:
                - 'logs:CreateLogGroup'
                - 'logs:CreateLogStream'
                - 'logs:PutLogEvents'
              Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*'
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /scan
            Method: POST
            RequestParameters:
              - method.request.header.Content-Type:
                  Required: true

Outputs:
  PiiScannerApi:
    Description: 'API Gateway endpoint URL for PII Scanner function'
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/scan/'
  
  PiiScannerFunction:
    Description: 'PII Scanner Lambda Function ARN'
    Value: !GetAtt ScanPIIFunction.Arn
